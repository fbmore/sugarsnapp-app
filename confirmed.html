<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>You're confirmed — SugarSnapp</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="robots" content="noindex">
<script>
/* Applies the stored appearance before first paint so a choice never
   flashes the wrong theme. "system" leaves the attribute off and lets
   prefers-color-scheme decide. */
(function(){try{
  var t=localStorage.getItem('ss-theme')||'dark';
  if(t==='dark'||t==='light'){document.documentElement.setAttribute('data-theme',t);}
}catch(e){}})();
</script>
<style>
/* ── App theme ───────────────────────────────────────────────────────────
   Mirrors the iOS app (SugarSnapp/Core/Theme.swift): vermillion enamel,
   warm ink, monospaced numerals. The MARKETING pages (index, vendors,
   shoppers, organizers, pricing, support, terms, privacy) deliberately keep
   the older green/serif identity — do not "re-sync" the two blocks.
   ──────────────────────────────────────────────────────────────────────── */
:root{
  color-scheme:light;
  --accent:#d95421;            /* Color.vermillion */
  --ink:#2b211c;               /* Color.keyInk    */
  --muted:#6f6259; --canvas:#f2f2f7; --surface:#ffffff;
  --line:rgba(43,33,28,.12); --bad:#8a3b2e; --field:#f2f2f7;
  --key-cream:#f4ead5;         /* Color.keyCream  */
  /* Fixed in EVERY theme. Theme.swift: the total window is "the one
     deliberately fixed-contrast surface besides the QR itself" — and a QR
     rendered on a dark surface simply stops scanning. */
  --total-window:#0e0d0b; --total-ink:#ffffff; --qr-surface:#ffffff;
  --font-ui:-apple-system,BlinkMacSystemFont,system-ui,'Segoe UI',Roboto,sans-serif;
  --font-mono:ui-monospace,'SF Mono',SFMono-Regular,Menlo,monospace;
}
:root[data-theme="dark"]{
  --ink:#f2efe9; --muted:#9b9089; --canvas:#000000; --surface:#1c1c1e;
  --line:rgba(255,255,255,.14); --bad:#ff6b57; --field:#2c2c2e; color-scheme:dark;
}
@media(prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ink:#f2efe9; --muted:#9b9089; --canvas:#000000; --surface:#1c1c1e;
    --line:rgba(255,255,255,.14); --bad:#ff6b57; --field:#2c2c2e; color-scheme:dark;
  }
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--font-ui);background:var(--canvas);color:var(--ink);line-height:1.6;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:44px 36px;max-width:440px;text-align:center}
.card img.logo{height:30px;margin-bottom:26px}
h1{font-size:1.6rem;margin-bottom:10px}
p{color:var(--muted);font-size:1rem}
.tick{font-size:44px;color:var(--accent);margin-bottom:14px}
.cta{display:inline-block;margin-top:26px;padding:13px 32px;border-radius:999px;background:var(--accent);color:#fff;font-size:1rem;text-decoration:none}
.fine{font-size:.85rem;margin-top:18px;color:#9aa694}
.error .tick{color:#b3402a}
</style>
</head>
<body>
<div class="card" id="card">
  <img class="logo" src="logo.svg" alt="SugarSnapp">
  <div class="tick" id="tick">✓</div>
  <h1 id="title">You're confirmed</h1>
  <p id="body">Your email is verified. Open SugarSnapp on your iPhone and you're ready to sell.</p>
  <a class="cta" id="open" href="#" style="display:none">Open SugarSnapp</a>
  <p class="fine" id="fine">If you're reading this on your iPhone, the app should open by itself.</p>
</div>
<script>
(function(){
  var params = new URLSearchParams(location.search);
  var hashParams = new URLSearchParams(location.hash.replace(/^#/, ''));
  var err = params.get('error_description') || hashParams.get('error_description');
  if (err) {
    document.getElementById('card').className = 'card error';
    document.getElementById('tick').textContent = '✕';
    document.getElementById('title').textContent = "That link didn't work";
    document.getElementById('body').textContent = decodeURIComponent(err).replace(/\+/g,' ') +
      ' — request a fresh link from the app and try again.';
    document.getElementById('fine').textContent = '';
    return;
  }
  // Forward any auth payload (PKCE ?code= or implicit #tokens) into the app,
  // so a tap on the same iPhone signs the vendor straight in.
  var payload = location.search + location.hash;
  if (payload.length > 1) {
    var target = 'sugarsnapp://auth-callback' + payload;
    var open = document.getElementById('open');
    open.href = target;
    open.style.display = 'inline-block';
    location.href = target;
  } else {
    document.getElementById('fine').textContent = '';
  }
})();
</script>
</body>
</html>
